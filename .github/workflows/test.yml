name: Test
on: [push]
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.9"
          enable-cache: true
      - name: Sync project
        run: uv sync --locked --dev
      - name: Run tests
        run: uv run pytest
