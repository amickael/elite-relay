name: Publish
on:
  push:
    tags:
      - v*
jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.9"
          enable-cache: true
      - name: Install python
        run: uv python install
      - name: Version
        run: uv version ${{ github.ref_name }}
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish
